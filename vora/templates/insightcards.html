<div class="insight-grid">{% for item in articles %}<a class="card insight-card" href="/{{locale}}/insights/{{item.slug}}"><small class="eyebrow">{{item.category}}</small><h3>{{item.title}}</h3><p>{{item.excerpt[:170]}}</p><span class="article-meta">{{item.published_at.date() if item.published_at else ''}} ↗</span></a>{% else %}<div class="note">No articles have been published yet. Editorial content is managed in the VORA admin portal.</div>{% endfor %}</div>
