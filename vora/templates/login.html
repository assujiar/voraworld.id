{% extends 'base.html' %}{% block shell %}<main class="wrap" style="max-width:490px;padding-top:10vh"><a href="/en/"><img src="/static/assets/vora-primary.svg" width="160" alt="VORA"></a><div class="form-panel" style="margin-top:30px"><span class="eyebrow">Secure administration</span><h2 style="font-size:2.3rem">Sign in</h2>{% if error %}<div class="alert" role="alert">{{error}}</div>{% endif %}<form method="post" action="/admin/login"><input type="hidden" name="csrf" value="{{csrf}}"><div class="field"><label>Email</label><input type="email" name="email" autocomplete="username" required></div><div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button class="button" style="width:100%">Sign in</button></form><p class="muted mini" style="margin-top:20px">Access is restricted. Contact the account administrator for an invite or recovery.</p></div></main>{% endblock %}
