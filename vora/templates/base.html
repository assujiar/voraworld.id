<!doctype html><html lang="{{ locale|default('en') }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ seo_title|default('VORA | Freight & Logistics') }}</title><meta name="description" content="{{ seo_desc|default('Freight and logistics, thoughtfully coordinated.') }}"><meta name="theme-color" content="#101720"><link rel="icon" href="/static/assets/vora-a-icon-primary.svg" type="image/svg+xml">{% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}{% for hreflang,link in alternates|default({})|dictsort %}<link rel="alternate" hreflang="{{ hreflang }}" href="{{ link }}">{% endfor %}<meta property="og:title" content="{{ seo_title|default('VORA') }}"><meta property="og:description" content="{{ seo_desc|default('Freight & Logistics') }}"><meta property="og:type" content="{{ og_type|default('website') }}">{% if canonical %}<meta property="og:url" content="{{ canonical }}">{% endif %}<meta name="twitter:card" content="summary_large_image">{% if noindex %}<meta name="robots" content="noindex,nofollow">{% endif %}<link rel="stylesheet" href="/static/css/site.css"><link rel="stylesheet" href="/static/css/experience.css?v=4"><link rel="stylesheet" href="/static/css/motion.css?v=2">{% if schema %}<script type="application/ld+json">{{ schema|tojson }}</script>{% endif %}</head><body class="{{ body_class|default('') }}">{% block shell %}{% endblock %}</body></html>
